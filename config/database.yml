default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: odin_flight_booker_development

test:
  <<: *default
  database: odin_flight_booker_test

production:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>
